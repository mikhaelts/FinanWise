<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sistema de Gestão de Finanças Pessoais" />
    <meta name="keywords" content="finanças, gestão, orçamento, receitas, despesas" />
    <title>Gestão de Finanças</title>
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth.js"></script>
    


   

  </head>

  <body class="dark-mode">
    <div class="container">
      <header>
        <img src="assets/images/logofin.png" alt="Logo" class="logo" />
        <button id="theme-toggle" class="btn" aria-label="Alternar tema">Mudar Tema</button>
      </header>

      <main class="main-content">
        <section class="left-panel">
          <!-- Filtro por Categoria -->
          <div class="filter-container">
            <label for="category-filter">Filtrar por Categoria:</label>
            <select id="category-filter">
              <option value="all">Todas</option>
              <option value="salario">Salário</option>
              <option value="gastos-pessoais">Gastos Pessoais</option>
              <option value="investimento">Investimento</option>
              <option value="alimentacao">Alimentação</option>
              <option value="transporte">Transporte</option>
              <option value="outros">Outros</option>
              <option value="uber">Serviços</option>
            </select>
          </div>

          <!-- Painel de Saldo Atual e Despesas/Receitas -->
          <div class="balance">
            <h2>Saldo Atual em <span id="current-month">Janeiro</span></h2>
            <p id="balance">R$ 0.00</p>
          </div>

          <div class="income-expense">
            <div>
              <h2>Receitas</h2>
              <p id="money-plus" class="money plus">+R$ 0.00</p>
            </div>
            <div>
              <h2>Despesas</h2>
              <p id="money-minus" class="money minus">-R$ 0.00</p>
            </div>
          </div>

          <!-- Seção Selecionar Ano -->
          <div class="year-section">
            <h2>Selecione o Ano</h2>
            <div class="year-container"></div>
          </div>

          <!-- Seção Selecionar Mês -->
          <div class="calendar-container">
            <h2>Selecione o Mês</h2>
            <div id="calendar" class="calendar-card"></div>
          </div>

          <h2>Histórico</h2>
          <ul id="list" class="list"></ul>
        </section>

        <section class="right-panel">
          <div class="form-container">
            <h2>Adicionar Transação</h2>
            <form id="form">
              <div class="form-control">
                <label for="text">Descrição</label>
                <input type="text" id="text" placeholder="Digite a descrição" required />
              </div>
              <div class="form-control">
                <label for="amount">Valor <br />(negativo - despesa, positivo - receita)</label>
                <input type="number" id="amount" placeholder="Digite o valor" required />
              </div>
              <div class="form-control">
                <label for="category">Categoria</label>
                <select id="category" required>
                  <option value="salario">Salário</option>
                  <option value="alimentacao">Alimentação</option>
                  <option value="transporte">Transporte</option>
                  <option value="outros">Outros</option>
                  <option value="uber">Serviços</option>
                  <option value="gastos-pessoais">Gastos Pessoais</option>
                  <option value="investimento">Investimento</option>
                </select>
              </div>
              <button type="submit" class="btn">Adicionar Transação</button>
            </form>
          </div>

          <div class="chart-container">
            <h2>Despesas por Mês</h2>
            <canvas id="expenseChart"></canvas>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        push,
        remove,
        onChildAdded,
        query,
        orderByChild,
        equalTo,
        get,
        set
      } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-database.js";

      // Configuração do Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyA8JISrdYGURqlEitwjhuQ3Tp74ClnJlNg",
        authDomain: "finanwise-6e27e.firebaseapp.com",
        databaseURL: "https://finanwise-6e27e-default-rtdb.firebaseio.com",
        projectId: "finanwise-6e27e",
        storageBucket: "finanwise-6e27e.appspot.com",
        messagingSenderId: "18762139497",
        appId: "1:18762139497:web:40efe768a33a5cfb181ff8",
      };

      // Inicializar o Firebase
      const app = initializeApp(firebaseConfig);
      const database = getDatabase(app);

      document.addEventListener("DOMContentLoaded", () => {
        // Seleciona os elementos da página
        const balance = document.getElementById("balance");
        const money_plus = document.getElementById("money-plus");
        const money_minus = document.getElementById("money-minus");
        const list = document.getElementById("list");
        const form = document.getElementById("form");
        const text = document.getElementById("text");
        const amount = document.getElementById("amount");
        const category = document.getElementById("category");
        const calendar = document.getElementById("calendar");
        const currentMonthDisplay = document.getElementById("current-month");
        const themeToggle = document.getElementById("theme-toggle");
        const categoryFilter = document.getElementById("category-filter");
        const ctx = document.getElementById("expenseChart").getContext("2d");


        

        // Variáveis globais para controle
        let transactions = [];
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear(); // Ano atual
        let expenseChart = null;
        let selectedCategory = "all"; // Valor padrão atualizado para "all"
        let editTransactionId = null; // Para controlar edição

        const months = [
          "Janeiro",
          "Fevereiro",
          "Março",
          "Abril",
          "Maio",
          "Junho",
          "Julho",
          "Agosto",
          "Setembro",
          "Outubro",
          "Novembro",
          "Dezembro",
        ];

        // Alternar entre temas
        themeToggle.addEventListener("click", () => {
          document.body.classList.toggle("light-mode");
          localStorage.setItem(
            "theme",
            document.body.classList.contains("light-mode") ? "light" : "dark"
          );
        });

        // Aplicar o tema salvo
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light") {
          document.body.classList.add("light-mode");
        }

        // Exibe o calendário de meses
        function displayCalendar() {
          calendar.innerHTML = months
            .map(
              (month, index) => `
            <div class="calendar-item ${index === currentMonth ? "active" : ""}" data-month="${index}">
              ${month}
            </div>
          `
            )
            .join("");

          document.querySelectorAll(".calendar-item").forEach((item) => {
            item.addEventListener("click", () => {
              currentMonth = parseInt(item.getAttribute("data-month"));
              currentMonthDisplay.innerText = months[currentMonth];
              document.querySelector(".calendar-item.active").classList.remove("active");
              item.classList.add("active");
              updateTransactions(); // Atualiza as transações ao mudar o mês
            });
          });
        }

        // Atualiza as transações filtrando por ano, mês e categoria
        function updateTransactions() {
          list.innerHTML = ""; // Limpa a lista atual
          transactions = [];

          // Consulta transações filtrando pelo ano atual
          const transactionsRef = ref(database, "transactions");
          const transactionsQuery = query(
            transactionsRef,
            orderByChild("year"),
            equalTo(currentYear)
          );

          get(transactionsQuery)
            .then((snapshot) => {
              if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                  const transaction = childSnapshot.val();
                  // Filtra também pelo mês e categoria selecionada
                  if (
                    transaction.month === currentMonth &&
                    (selectedCategory === "all" || transaction.category === selectedCategory)
                  ) {
                    transactions.push({ ...transaction, id: childSnapshot.key });
                    addTransactionDOM(transaction, childSnapshot.key);
                  }
                });
              }
              updateValues();
              updateChart();
            })
            .catch((error) => {
              console.error("Erro ao buscar transações:", error);
            });
        }

        // Adiciona ou atualiza uma transação no Firebase e atualiza o DOM
        function addTransaction(e) {
          e.preventDefault();

          const transaction = {
            year: currentYear, // Armazena o ano selecionado
            month: currentMonth, // Armazena o mês selecionado
            text: text.value,
            amount: +amount.value,
            category: category.value,
          };

          if (editTransactionId) {
            // Atualiza a transação existente
            set(ref(database, "transactions/" + editTransactionId), transaction)
              .then(() => {
                // Limpa o modo de edição
                editTransactionId = null;
                form.querySelector('button[type="submit"]').textContent = "Adicionar Transação";
                text.value = "";
                amount.value = "";
                category.value = "";
                updateTransactions();
              })
              .catch((error) => {
                console.error("Erro ao atualizar transação:", error);
              });
          } else {
            // Cria uma nova transação
            push(ref(database, "transactions"), transaction)
              .then(() => {
                text.value = "";
                amount.value = "";
                category.value = "";
              })
              .catch((error) => {
                console.error("Erro ao adicionar transação:", error);
              });
          }
        }

        // Adiciona a transação no DOM com botões de editar e excluir
        function addTransactionDOM(transaction, id) {
          const sign = transaction.amount < 0 ? "-" : "+";
          const item = document.createElement("li");
          item.classList.add(transaction.amount < 0 ? "minus" : "plus", "list-item");
          item.setAttribute("data-id", id);

          item.innerHTML = `
            ${transaction.text} <span>${sign}R$ ${Math.abs(transaction.amount).toFixed(2)}</span>
            <span class="category">${transaction.category}</span>
            <button class="edit-btn" data-id="${id}">
              <i class="fas fa-edit"></i>
            </button>
            <button class="delete-btn" data-id="${id}">
              <i class="fas fa-trash-alt"></i>
            </button>
          `;

          list.appendChild(item);

          // Evento para editar a transação
          item.querySelector(".edit-btn").addEventListener("click", () => {
            text.value = transaction.text;
            amount.value = transaction.amount;
            category.value = transaction.category;
            editTransactionId = id;
            form.querySelector('button[type="submit"]').textContent = "Atualizar Transação";
          });

          // Evento para remover a transação
          item.querySelector(".delete-btn").addEventListener("click", () => {
            removeTransaction(id);
          });
        }

        // Atualiza os valores de saldo, receitas e despesas
        function updateValues() {
          const amounts = transactions.map((transaction) => transaction.amount);
          const total = amounts.reduce((acc, item) => acc + item, 0).toFixed(2);
          const income = amounts.filter((item) => item > 0).reduce((acc, item) => acc + item, 0).toFixed(2);
          const expense = (amounts.filter((item) => item < 0).reduce((acc, item) => acc + item, 0) * -1).toFixed(2);

          balance.innerText = `R$ ${total}`;
          money_plus.innerText = `+R$ ${income}`;
          money_minus.innerText = `-R$ ${expense}`;
        }

        // Atualiza o gráfico de despesas e receitas
        function updateChart() {
          const monthlyTotals = months.map((_, index) => {
            const monthlyTransactions = transactions.filter((t) => t.month === index);
            return monthlyTransactions.reduce((acc, t) => acc + t.amount, 0);
          });

          const expenses = monthlyTotals.map((total) => (total < 0 ? -total : 0));
          const income = monthlyTotals.map((total) => (total > 0 ? total : 0));

          if (expenseChart) {
            expenseChart.data.datasets[0].data = expenses;
            expenseChart.data.datasets[1].data = income;
            expenseChart.update();
          } else {
            expenseChart = new Chart(ctx, {
              type: "bar",
              data: {
                labels: months,
                datasets: [
                  {
                    label: "Despesas",
                    data: expenses,
                    backgroundColor: "rgba(255, 99, 132, 0.2)",
                    borderColor: "rgba(255, 99, 132, 1)",
                    borderWidth: 1,
                  },
                  {
                    label: "Receitas",
                    data: income,
                    backgroundColor: "rgba(54, 162, 235, 0.2)",
                    borderColor: "rgba(54, 162, 235, 1)",
                    borderWidth: 1,
                  },
                ],
              },
              options: {
                scales: {
                  y: {
                    beginAtZero: true,
                  },
                },
              },
            });
          }
        }

        // Remove a transação do Firebase e do DOM
        function removeTransaction(id) {
          remove(ref(database, `transactions/${id}`))
            .then(() => {
              const item = document.querySelector(`li[data-id="${id}"]`);
              if (item) item.remove();
              transactions = transactions.filter((transaction) => transaction.id !== id);
              updateValues();
              updateChart();
            })
            .catch((error) => {
              console.error("Erro ao remover transação:", error);
            });
        }

        // Listener para adição de novas transações
        onChildAdded(ref(database, "transactions"), (snapshot) => {
          const newTransaction = snapshot.val();
          if (
            newTransaction.year === currentYear &&
            newTransaction.month === currentMonth &&
            (selectedCategory === "all" || newTransaction.category === selectedCategory)
          ) {
            transactions.push({ ...newTransaction, id: snapshot.key });
            addTransactionDOM(newTransaction, snapshot.key);
            updateValues();
            updateChart();
          }
        });

        // Atualiza as transações ao mudar a categoria
        categoryFilter.addEventListener("change", () => {
          selectedCategory = categoryFilter.value;
          updateTransactions();
        });

        // Exibe o calendário e atualiza o mês atual
        displayCalendar();
        currentMonthDisplay.innerText = months[currentMonth];
        updateTransactions();

        // Lida com o envio do formulário
        form.addEventListener("submit", addTransaction);

        /* ------------------- Gerenciamento dos Anos ------------------- */
        // Seleciona o container de anos existente na seção "year-section"
        const yearContainer = document.querySelector(".year-container");

        // Recupera os anos do localStorage ou inicia com 2024
        function getStoredYears() {
          return JSON.parse(localStorage.getItem("years")) || [2024];
        }

        // Salva os anos no localStorage
        function saveYears(years) {
          localStorage.setItem("years", JSON.stringify(years));
        }

        // Atualiza a lista de anos adicionando o ano atual, se necessário
        function updateYears() {
          let years = getStoredYears();
          const nowYear = new Date().getFullYear();
          if (!years.includes(nowYear)) {
            years.push(nowYear);
            saveYears(years);
          }
          return years;
        }

        // Exibe os anos na tela e adiciona eventos para seleção
        function displayYears() {
          const years = updateYears();
          yearContainer.innerHTML = years
            .map((year) => `<div class="year-item ${year === currentYear ? "active" : ""}" data-year="${year}">${year}</div>`)
            .join("");

          document.querySelectorAll(".year-item").forEach((item) => {
            item.addEventListener("click", () => {
              document.querySelectorAll(".year-item").forEach((el) => el.classList.remove("active"));
              item.classList.add("active");
              currentYear = parseInt(item.dataset.year);
              updateTransactions();
            });
          });
        }
        displayYears();
      });
    </script>

  </body>
</html>
